name: vault

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        run: |
          python3 -m unittest discover -s tests -q
          python3 -m unittest discover -s tools -p 'test_*.py' -q
      - name: validate
        run: python3 tools/sb validate
      - name: eval
        run: python3 tools/sb eval
