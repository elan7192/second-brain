  <script>
    const DATA = {"nodes": [{"id": "growth-competitors", "label": "Competitors", "layer": "competitors", "color": "#818cf8", "val": 6, "path": "growth/growth-competitors.md", "body": "# Competitors\n\nHub: [[growth-core]]. Empty of named firms. Do not invent a bake-off.\n\nA normal agency on a fixed fee keeps 20-30% after salaries, per [[src-deronin-growthos-vault]]. That contrast is the author's. Not a margin we measured.\n\nOur difference that is in this vault: rev-share floor [[growth-ruling-revshare]], bot ops with a human gate, memory in [[growth-core]]."}, {"id": "growth-content-kai", "label": "Content: Kai (DEMO)", "layer": "content", "color": "#facc15", "val": 8, "path": "growth/growth-content-kai.md", "body": "# Content: Kai (DEMO)\n\nPartner: [[growth-partner-kai]]. Offer: [[growth-offer-kai]]. Hub: [[growth-content]].\n\n| Topic | Hook | Views | Sales | Class |\n| --- | --- | --- | --- | --- |\n| Replace a $4k/mo VA with this chain | \"I stopped hiring for this task last month.\" | 5400 | 9 | sells |\n| One SOP, three tools | \"If you still paste between tabs, watch this.\" | 4100 | 7 | sells |\n| GPT does my inbox | \"Watch the bot clear 40 emails.\" | 31000 | 0 | views |\n\n## Gap\n\nInbox spectacle pulled views. Buyers came from \"replace a hire\" and \"SOP + tools.\" Next Ops scripts stay on cost-of-hire, not bot-wow."}, {"id": "growth-content-mira", "label": "Content: Mira (DEMO)", "layer": "content", "color": "#facc15", "val": 8, "path": "growth/growth-content-mira.md", "body": "# Content: Mira (DEMO)\n\nPartner: [[growth-partner-mira]]. Offer: [[growth-offer-mira]]. Hub: [[growth-content]].\n\n| Topic | Hook | Views | Sales | Class |\n| --- | --- | --- | --- | --- |\n| 3 hooks that get brand replies | \"Brands asked me for the template. I sold the workflow instead.\" | 12000 | 18 | sells |\n| How I batch 10 product ads | \"Same body. Ten first lines. One afternoon.\" | 8600 | 11 | sells |\n| AI girl eats sandwich | \"She bites it and the comments go feral.\" | 89000 | 1 | views |\n\n## Gap\n\nSandwich pulled ~7x the views of the brand-reply video and ~18x fewer sales. Next scripts copy the first row, not the third.\n\nFormats that match the sellers: problem-first and workflow-batch. See [[growth-trend-2026-08-25]]."}, {"id": "growth-content", "label": "Content data", "layer": "content", "color": "#facc15", "val": 8, "path": "growth/growth-content.md", "body": "# Content data\n\nViews vs sales, hook by hook. Hub for [[growth-core]].\n\n- Author's chess example (not our account): [[growth-insights]]\n- DEMO Mira: [[growth-content-mira]]\n- DEMO Kai: [[growth-content-kai]]\n\nRule: [[growth-ruling-conversion]]. Engine: [[growth-playbook-content]]."}, {"id": "growth-core", "label": "GROWTHOS / VAULT CORE", "layer": "core", "color": "#f472b6", "val": 18, "path": "growth/growth-core.md", "body": "# GROWTHOS / VAULT CORE\n\nOperator memory for a Grokbot growth system. Point the bot here before a new partner. It starts with what prior partners taught, not from zero.\n\nSource: [[src-deronin-growthos-vault]]. Concept: [[growth-operator]]. Door: [[GrowthOS]].\n\n## Load order\n\n1. [[growth-rulings]]\n2. [[growth-playbooks]]\n3. [[growth-niche-ai-ugc]] · [[growth-niche-ai-ops]]\n4. [[growth-partners]] · [[growth-creators]]\n5. [[growth-content]]\n6. [[growth-trends]]\n7. [[growth-memories]]\n\n## Layers\n\n| Layer | Hub |\n| --- | --- |\n| Niches | [[growth-niche-ai-ugc]] · [[growth-niche-ai-ops]] |\n| Creators | [[growth-creators]] |\n| Partners | [[growth-partners]] |\n| Offers | [[growth-offers]] |\n| Content | [[growth-content]] |\n| Playbooks | [[growth-playbooks]] |\n| Rulings | [[growth-rulings]] |\n| Trend radar | [[growth-trends]] |\n| Memories | [[growth-memories]] |\n| Strategy | [[growth-strategy]] |\n| Insights | [[growth-insights]] |\n| Competitors | [[growth-competitors]] |\n| Journal | [[growth-journal-2026-08-25]] |\n\n## Hard stops\n\nVault does not post, pay, send, or create live Whop objects. See D5 in `decisions.md`.\n\nPartner names and dollar figures in this folder are **DEMO** unless a note says otherwise. Do not treat them as live deals.\n\n## Check\n\nA briefing must cite these pages. If a claim has no page, mark `unverified` or stop."}, {"id": "growth-creators", "label": "Creators", "layer": "creators", "color": "#38bdf8", "val": 8, "path": "growth/growth-creators.md", "body": "# Creators\n\nScout log. Hub for [[growth-core]]. Handles are **DEMO**.\n\n## Shortlist\n\n- [[growth-scout-mira]] : keep. Signed. [[growth-partner-mira]]\n- [[growth-scout-kai]] : keep. Signed. [[growth-partner-kai]]\n- [[growth-scout-elena]] : keep. Pipeline. [[growth-partner-elena]]\n\n## Passed\n\n- [[growth-passed-viewfarmer]] : views without craft. [[growth-ruling-proof]]"}, {"id": "growth-fail-view-chase", "label": "Failure: view-chase (DEMO)", "layer": "memories", "color": "#f9a8d4", "val": 8, "path": "growth/growth-fail-view-chase.md", "body": "# Failure: view-chase (DEMO)\n\nHub: [[growth-memories]]. Content: [[growth-content-mira]] sandwich row, [[growth-content-kai]] inbox row.\n\nA bot chasing views writes the spectacle. A bot reading sales writes the workflow. Chess numbers on [[growth-insights]] are the author's example. Ours are the DEMO tables.\n\nLocked by [[growth-ruling-conversion]]."}, {"id": "growth-insights", "label": "Insights", "layer": "insights", "color": "#fde68a", "val": 6, "path": "growth/growth-insights.md", "body": "# Insights\n\nDurable lessons. Hub: [[growth-core]].\n\n## Chess example (author, unverified)\n\nFrom [[src-deronin-growthos-vault]]:\n\n- \"6 attacking tips that separate 1000 from 2000\" : 74k views, 51 bought\n- \"opponent finds a secret rule\" : 135k views, 2 bought\n\nNearly 2x views. 25x fewer sales. The author says he is a former candidate master. We did not re-count the channel.\n\n## Talent is easier than budget\n\nScout for skill with no distribution, not clients with a budget. See [[growth-strategy]].\n\n## Same ladder, next partner\n\nDo not redesign the offer. Reuse [[growth-offer-mira]] rungs. Kai already did. See [[growth-offer-kai]]."}, {"id": "growth-journal-2026-08-25", "label": "Journal: 2026-08-25", "layer": "journal", "color": "#94a3b8", "val": 6, "path": "growth/growth-journal-2026-08-25.md", "body": "# Journal: 2026-08-25\n\nHub: [[growth-core]].\n\nBuilt the GrowthOS vault from [[src-deronin-growthos-vault]]. DEMO partners Mira, Kai, Elena. No live outreach. No Whop writes.\n\nNext human look: [[growth-partner-elena]] terms vs [[growth-ruling-revshare]]. Next bot job: briefing from `python3 tools/growth-brief.py`."}, {"id": "growth-memories", "label": "Memories", "layer": "memories", "color": "#f9a8d4", "val": 8, "path": "growth/growth-memories.md", "body": "# Memories\n\nWins, failures, what to reuse. Hub for [[growth-core]].\n\n## Wins\n\n- [[growth-win-first-check]]\n- [[growth-win-referral]]\n\n## Failures\n\n- [[growth-fail-view-chase]]"}, {"id": "growth-niche-ai-ops", "label": "Niche: AI Ops", "layer": "niches", "color": "#34d399", "val": 8, "path": "growth/growth-niche-ai-ops.md", "body": "# Niche: AI Ops\n\nWatch-only. Do not open a second live niche until [[growth-niche-ai-ugc]] has a first check. See [[growth-ruling-one-niche]].\n\nNamed as a hot niche in [[src-deronin-growthos-vault]]. No independent supply/demand count in this vault.\n\n## Who is in it\n\n- Partner: [[growth-partner-kai]] (DEMO, signed after UGC first check)\n- Scout: [[growth-scout-kai]]"}, {"id": "growth-niche-ai-ugc", "label": "Niche: AI UGC", "layer": "niches", "color": "#34d399", "val": 8, "path": "growth/growth-niche-ai-ugc.md", "body": "# Niche: AI UGC\n\nCurrent pick. See [[growth-ruling-one-niche]]. Hub: [[growth-core]].\n\n## Demand\n\nBrands want a high volume of short creatives (ads, hooks, product demos). Article example: 30 creatives a week. Source: [[src-deronin-growthos-vault]]. That weekly count is the author's example, not a measured census.\n\n## Supply\n\nThin. The same article says many of these creators sit around 400 followers with a couple of freelance gigs and no offer. `unverified` as a market statistic. Used as the scout filter on [[growth-playbook-scout]].\n\n## Heat\n\nHeating. Skill people will pay $100 to $5,000 to learn, per that article. Range is the author's, not a sale we ran.\n\n## Who is in it\n\n- Keep: [[growth-scout-mira]] · [[growth-scout-elena]]\n- Partner: [[growth-partner-mira]]\n- Pipeline: [[growth-partner-elena]]\n- Pass: [[growth-passed-viewfarmer]]\n\n## Offer that sold (DEMO)\n\n[[growth-offer-mira]]"}, {"id": "growth-offer-kai", "label": "Offer: Kai Ops community (DEMO)", "layer": "offers", "color": "#c084fc", "val": 7, "path": "growth/growth-offer-kai.md", "body": "# Offer: Kai Ops community (DEMO)\n\nPartner: [[growth-partner-kai]]. Hub: [[growth-offers]].\n\n| Product | Price | Type |\n| --- | --- | --- |\n| AI Ops Community | $99/mo | subscription |\n| Operator Playbook | $199 | one time |\n| 1:1 Audit | $399 | one time |\n\nSame three-rung ladder as [[growth-offer-mira]]. Do not invent a fourth rung for the next partner until this ladder has a month of data."}, {"id": "growth-offer-mira", "label": "Offer: Mira UGC community (DEMO)", "layer": "offers", "color": "#c084fc", "val": 7, "path": "growth/growth-offer-mira.md", "body": "# Offer: Mira UGC community (DEMO)\n\nPartner: [[growth-partner-mira]]. Hub: [[growth-offers]].\n\n| Product | Price | Type |\n| --- | --- | --- |\n| AI UGC Community | $49/mo | subscription |\n| Starter Pack (templates + presets) | $149 | one time |\n| 1:1 Audit | $299 | one time |\n\nPrices are the article's example, used as DEMO. Not a live Whop catalog. See [[growth-playbook-whop]]."}, {"id": "growth-offers", "label": "Offers", "layer": "offers", "color": "#c084fc", "val": 7, "path": "growth/growth-offers.md", "body": "# Offers\n\nDEMO. Hub for [[growth-core]]. Shape copied from the Whop example in [[src-deronin-growthos-vault]].\n\n- [[growth-offer-mira]] : community $49/mo, pack $149, audit $299\n- [[growth-offer-kai]] : community $99/mo, playbook $199, audit $399"}, {"id": "growth-partner-elena", "label": "Partner 3: Elena Voss (DEMO, pipeline)", "layer": "partners", "color": "#e879f9", "val": 10, "path": "growth/growth-partner-elena.md", "body": "# Partner 3: Elena Voss (DEMO, pipeline)\n\nScout: [[growth-scout-elena]]. Status: not signed.\n\n## Terms on the table\n\nShe asked for 15% to us. Floor is 25%. See [[growth-ruling-revshare]]. No counter below the floor.\n\n## Objections\n\n1. Dead Gumroad links. She has been burned by offers that rot.\n2. Wants a lower rev-share because \"I already have an audience.\" Audience without a live checkout is the hole.\n\n## Next\n\nIf she meets the floor, reuse Mira's offer shape ([[growth-offer-mira]]) and this week's hooks ([[growth-trend-2026-08-25]]). Do not invent a new model."}, {"id": "growth-partner-kai", "label": "Partner 2: Kai Okonkwo (DEMO)", "layer": "partners", "color": "#e879f9", "val": 10, "path": "growth/growth-partner-kai.md", "body": "# Partner 2: Kai Okonkwo (DEMO)\n\nScout: [[growth-scout-kai]]. Offer: [[growth-offer-kai]]. Content: [[growth-content-kai]]. Referral from [[growth-partner-mira]].\n\n## Terms\n\n- Rev-share: 30%\n- Niche: [[growth-niche-ai-ops]]\n- Signed: 2026-08-02 (DEMO date)\n\n## Objections before signing\n\n1. \"Ops people will not pay $99/mo.\" Counter: they already pay tools. They will pay a workflow that removes a hire.\n2. Wanted to sell 1:1 only. Counter: 1:1 caps. Community plus templates scales. Same shape as [[growth-offer-mira]].\n\n## What this partner taught\n\nDo not open AI Ops as a second live niche until UGC has a first check. Mira's check unlocked this one. See [[growth-ruling-one-niche]] and [[growth-win-referral]]."}, {"id": "growth-partner-mira", "label": "Partner 1: Mira Vale (DEMO)", "layer": "partners", "color": "#e879f9", "val": 10, "path": "growth/growth-partner-mira.md", "body": "# Partner 1: Mira Vale (DEMO)\n\nScout: [[growth-scout-mira]]. Offer: [[growth-offer-mira]]. Content: [[growth-content-mira]].\n\n## Terms\n\n- Rev-share: 30% (above [[growth-ruling-revshare]])\n- Niche: [[growth-niche-ai-ugc]]\n- Signed: 2026-07-12 (DEMO date)\n\n## Objections before signing\n\n1. \"I already make money in DMs.\" Counter: DMs do not compound. A $49/mo community does.\n2. \"AI will replace me.\" Counter: the offer is the workflow, not the face.\n3. Generic outreach ignored. Specific hook critique got the reply. See [[growth-playbook-outreach]].\n\n## What this partner taught\n\nConversion topics beat view topics on her account. See [[growth-content-mira]]. Use that before writing for the next UGC partner."}, {"id": "growth-partners", "label": "Partners", "layer": "partners", "color": "#e879f9", "val": 10, "path": "growth/growth-partners.md", "body": "# Partners\n\nDEMO roster. Hub for [[growth-core]].\n\n| Partner | Status | Rev-share | Notes |\n| --- | --- | --- | --- |\n| [[growth-partner-mira]] | live | 30% | First check. [[growth-win-first-check]] |\n| [[growth-partner-kai]] | live | 30% | Referral. [[growth-win-referral]] |\n| [[growth-partner-elena]] | pipeline | - | 15% ask. Blocked by [[growth-ruling-revshare]] |"}, {"id": "growth-passed-viewfarmer", "label": "Passed: ViewFarmer (DEMO)", "layer": "creators", "color": "#38bdf8", "val": 8, "path": "growth/growth-passed-viewfarmer.md", "body": "# Passed: ViewFarmer (DEMO)\n\nHandle: `@viewfarmer.demo`. Niche: [[growth-niche-ai-ugc]]. Hub: [[growth-creators]].\n\n## Why passed\n\nHigh views. No craft a buyer would pay to learn. Faces and trends, no product-hook skill. Fails [[growth-ruling-proof]].\n\n## One line\n\nFollowers are not the product. The workflow is."}, {"id": "growth-playbook-content", "label": "Playbook: content engine", "layer": "playbooks", "color": "#fbbf24", "val": 9, "path": "growth/growth-playbook-content.md", "body": "# Playbook: content engine\n\nFilled prompt from [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]].\n\n```yaml\nHere's the creator's profile: [link]. Here's their offer: [what we're selling, price]. Analyze their last 20 videos and 20 videos from the top people in this niche\n- for each one: topic, hook, view count, and whether it leads to an offer sale or just pulls views\n- find the gap: which topics pull views, and which actually push someone to buy\n- give me 10 video or tweets ideas, each one built to sell the offer, with a hook in the first 3 seconds\n- under each: why it converts, instead of just collecting likes\n```\n\n## Lesson already in the vault\n\nA views winner can be a sales loser. Chess example on [[growth-insights]]. DEMO rows: [[growth-content-mira]], [[growth-content-kai]].\n\nThis week's formats: [[growth-trend-2026-08-25]]."}, {"id": "growth-playbook-outreach", "label": "Playbook: outreach that does not sound like outreach", "layer": "playbooks", "color": "#fbbf24", "val": 9, "path": "growth/growth-playbook-outreach.md", "body": "# Playbook: outreach that does not sound like outreach\n\nFrom [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]]. **Do not send.** File drafts only.\n\nYou do not write \"hi, I offer services.\" You write to the person about a hole they already see.\n\n## Shape\n\n1. Name one specific piece of their work (video, hook, craft).\n2. Name the hole: no offer, no checkout, views that do not sell.\n3. One line on the system: distribution plus a Whop offer, rev-share, they keep the skill.\n4. Ask for a 15-minute look at their last 10 videos. No deck.\n\n## What already failed\n\nGeneric \"I can grow your account\" got ignored on [[growth-partner-mira]] first pass. Specific hook critique got a reply."}, {"id": "growth-playbook-scout", "label": "Playbook: scout", "layer": "playbooks", "color": "#fbbf24", "val": 9, "path": "growth/growth-playbook-scout.md", "body": "# Playbook: scout\n\nFilled prompt from [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]].\n\n```yaml\nFind 20 AI UGC creators on TikTok and Instagram that fit all of this:\n - they post their own AI video creatives (brand ads, product hooks) and it's getting positive feedback\n - no visible offer: no link in bio to a service, course, or community\n - for each one give me: handle, link to their best video, why the creative is strong, and what's broken in their distribution in one line\n - public profiles only\n - note any mention of working with products and of results\n```\n\n## After the list\n\nRead the profiles yourself the first few times. The bot will call average work \"strong\". Tune the bar. See [[growth-ruling-proof]].\n\nFile each keep as a scout note under [[growth-creators]]. File each pass with a one-line why."}, {"id": "growth-playbook-whop", "label": "Playbook: Whop CLI", "layer": "playbooks", "color": "#fbbf24", "val": 9, "path": "growth/growth-playbook-whop.md", "body": "# Playbook: Whop CLI\n\nCommand shapes from [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]]. **Do not run against a live account from this vault.**\n\n## Setup prompt (human pastes)\n\nInstall the Whop CLI, sign in, and run `whop skills add`\n- then run `whop --llms` and say in your own words what you can and cannot do with this login\n- list what is already on this account. If you find products the human did not create, leave them alone and report them\n- report anything Whop turns on by default that was not asked for\n\n## Offer prompt (AI UGC example)\n\n```yaml\nSet up the offer on Whop for this creator:\n- AI UGC Community, $49/mo, subscription\n- Starter Pack (templates + presets), $149, one time\n- 1:1 Audit, $299, one time\n- create a checkout link for each one and give me the three URLs\n- don't touch anything belonging to another business on this account\n```\n\n## Commands cited\n\n```bash\nwhop products list\nwhop plans create --help\nwhop checkout-configurations create --plan_id plan_xxx\nwhop stats time_series\n```\n\nEvery command takes `--format json`. See [[growth-ruling-no-money]]."}, {"id": "growth-playbooks", "label": "Playbooks", "layer": "playbooks", "color": "#fbbf24", "val": 9, "path": "growth/growth-playbooks.md", "body": "# Playbooks\n\nPrompts and command shapes. Hub for [[growth-core]].\n\n- [[growth-playbook-scout]] : find cracked creators with no offer\n- [[growth-playbook-content]] : write for sales, not views\n- [[growth-playbook-whop]] : offer wiring. Do not run live.\n- [[growth-playbook-outreach]] : hole they already see. Do not send.\n\nHuman gate: D5. These are files. They are not permission to post, pay, or send."}, {"id": "growth-ruling-conversion", "label": "Ruling: conversion over views", "layer": "rulings", "color": "#fb923c", "val": 9, "path": "growth/growth-ruling-conversion.md", "body": "# Ruling: conversion over views\n\n**2026-08-24.** Growth is knowing which content sells the offer. Views-only content is the wrong target.\n\nSource: [[src-deronin-growthos-vault]]. Hub: [[growth-rulings]]. Chess example on [[growth-insights]]. Live DEMO rows on [[growth-content-mira]] and [[growth-content-kai]]."}, {"id": "growth-ruling-no-money", "label": "Ruling: bot never makes money moves", "layer": "rulings", "color": "#fb923c", "val": 9, "path": "growth/growth-ruling-no-money.md", "body": "# Ruling: bot never makes money moves\n\n**2026-08-24.** Never delete products, change a price, or move money without confirmation. If you hit a limit, stop and tell the human rather than working around it.\n\nSource: quoted Whop prompt in [[src-deronin-growthos-vault]]. Hub: [[growth-rulings]].\n\nAPI key create/rotate/delete is dashboard-only. CLI does not expose it. Do not work around that."}, {"id": "growth-ruling-one-niche", "label": "Ruling: one niche at a time", "layer": "rulings", "color": "#fb923c", "val": 9, "path": "growth/growth-ruling-one-niche.md", "body": "# Ruling: one niche at a time\n\n**2026-08-24.** Pick one hyped niche with insane demand and thin supply. Do not spread.\n\nSource: 90-day plan in [[src-deronin-growthos-vault]]. Hub: [[growth-rulings]].\n\nCurrent pick: [[growth-niche-ai-ugc]]. [[growth-niche-ai-ops]] is watch-only until UGC has a live partner and a first check."}, {"id": "growth-ruling-proof", "label": "Ruling: proof of skill", "layer": "rulings", "color": "#fb923c", "val": 9, "path": "growth/growth-ruling-proof.md", "body": "# Ruling: proof of skill\n\n**2026-08-24.** Never partner without proof of skill.\n\nSource: [[src-deronin-growthos-vault]]. Hub: [[growth-rulings]].\n\nProof means work a stranger can inspect: videos, clients, or a workflow you would pay to learn. Follower count is not proof. See [[growth-passed-viewfarmer]]."}, {"id": "growth-ruling-revshare", "label": "Ruling: rev-share floor", "layer": "rulings", "color": "#fb923c", "val": 9, "path": "growth/growth-ruling-revshare.md", "body": "# Ruling: rev-share floor\n\n**2026-08-24.** Never below 25% rev-share.\n\nSource: [[src-deronin-growthos-vault]]. Hub: [[growth-rulings]].\n\nElena Voss asked for 15%. Pass until terms meet this floor. See [[growth-partner-elena]]."}, {"id": "growth-rulings", "label": "Rulings", "layer": "rulings", "color": "#fb923c", "val": 9, "path": "growth/growth-rulings.md", "body": "# Rulings\n\nOne dated line each. Do not re-argue. Hub for [[growth-core]].\n\n- [[growth-ruling-revshare]] : 2026-08-24. Never below 25% rev-share.\n- [[growth-ruling-proof]] : 2026-08-24. Never partner without proof of skill.\n- [[growth-ruling-no-money]] : 2026-08-24. Bot never moves money, deletes products, or changes price without a yes.\n- [[growth-ruling-one-niche]] : 2026-08-24. One hyped niche at a time.\n- [[growth-ruling-conversion]] : 2026-08-24. Write content that sells the offer, not content that only pulls views.\n\nSource of the first two: [[src-deronin-growthos-vault]]. The money stop is from the quoted Whop CLI article in that tweet."}, {"id": "growth-scout-elena", "label": "Scout: Elena Voss (DEMO)", "layer": "creators", "color": "#38bdf8", "val": 8, "path": "growth/growth-scout-elena.md", "body": "# Scout: Elena Voss (DEMO)\n\nHandle: `@elena.clips.demo`. Niche: [[growth-niche-ai-ugc]]. Status: pipeline → [[growth-partner-elena]].\n\n## Why the work is strong\n\nContrarian hooks (\"stop making talking-head avatars\") then a product cutaway. Matches this week's radar: [[growth-trend-2026-08-25]].\n\n## What is broken in distribution\n\nLink in bio is a Linktree with three dead Gumroad URLs. Offer existed. It is not live.\n\n## Proof of skill\n\nCraft is real. Terms are not. She asked for 15% rev-share. Blocked by [[growth-ruling-revshare]] until she moves."}, {"id": "growth-scout-kai", "label": "Scout: Kai Okonkwo (DEMO)", "layer": "creators", "color": "#38bdf8", "val": 8, "path": "growth/growth-scout-kai.md", "body": "# Scout: Kai Okonkwo (DEMO)\n\nHandle: `@kai.ops.demo`. Niche: [[growth-niche-ai-ops]]. Status: signed → [[growth-partner-kai]]. Referral from [[growth-partner-mira]].\n\n## Why the work is strong\n\nScreen-record workflows: one tool chain, one outcome, timestamps. People save the videos. That is teachable.\n\n## What is broken in distribution\n\nPosts as \"notes to self.\" No community. No price. Saves do not become a checkout.\n\n## Proof of skill\n\nWorkflow videos plus two named freelance outcomes in captions. Passes [[growth-ruling-proof]]."}, {"id": "growth-scout-mira", "label": "Scout: Mira Vale (DEMO)", "layer": "creators", "color": "#38bdf8", "val": 8, "path": "growth/growth-scout-mira.md", "body": "# Scout: Mira Vale (DEMO)\n\nHandle: `@mira.ugc.demo`. Niche: [[growth-niche-ai-ugc]]. Status: signed → [[growth-partner-mira]].\n\n## Why the work is strong\n\nProduct-hook cuts: first 2s is the product in hand, then the problem. Native handheld, burned captions. Brands in comments asking for \"the template.\"\n\n## What is broken in distribution\n\nNo link in bio. No checkout. Comments asking how to buy get a \"dm me.\" That is freelance, not an offer.\n\n## Proof of skill\n\nPublic work a stranger can inspect. Passes [[growth-ruling-proof]]."}, {"id": "growth-strategy", "label": "Strategy: shadow growth operator", "layer": "strategies", "color": "#a78bfa", "val": 6, "path": "growth/growth-strategy.md", "body": "# Strategy: shadow growth operator\n\nFrom [[src-deronin-growthos-vault]]. Hub: [[growth-core]].\n\nWord for word from the quoted playbook (friend @eptwts):\n\n- find people who are cracked at what they do and set up distribution\n- give them a growth playbook that does not need babysitting\n- help them ideate and set up an offer on Whop, take rev-share\n- set and forget\n\n$100k in 10 months on Whop is the author's claim about that friend. `unverified`. Do not use it as a forecast.\n\nYou do not sell your own product. You do not build an audience from zero. They bring skill. This vault brings the system.\n\nHuman keeps judgment and relationships. Bot keeps ops. Vault does not send. See D5."}, {"id": "growth-trend-2026-08-25", "label": "Trend radar: week of 2026-08-25", "layer": "trends", "color": "#22d3ee", "val": 8, "path": "growth/growth-trend-2026-08-25.md", "body": "# Trend radar: week of 2026-08-25\n\nHub: [[growth-trends]]. Niche: [[growth-niche-ai-ugc]].\n\nPublic 2026 UGC-ad writeups, not a platform ranking. Cite the URL if you reuse a line.\n\n## Formats converting this week\n\n1. **Hook first, body constant.** Write 5-10 first lines. Keep the same body and CTA. Test the hook, not the aesthetic. ([CraftStory](https://craftstory.com/blog/how-to-make-ugc-ads-with-ai/), [ugcad.ai](https://ugcad.ai/blog/how-to-create-ai-ugc-video-ads/))\n2. **Four hook families.** Problem call-out. Contrarian. Before/after or 14-day result. Curiosity gap. ([ugcad.ai](https://ugcad.ai/blog/how-to-create-ai-ugc-video-ads/))\n3. **30-35s spine.** Hook 0-3s, problem, product reveal, one proof number, CTA. ([ugcad.ai](https://ugcad.ai/blog/how-to-create-ai-ugc-video-ads/), [GetShorts](https://getshorts.ai/blog/ai-ugc-video-ads-guide))\n4. **Native, not polished.** Handheld, slight mess, 9:16, captions burned in. Over-clean reads as an ad. ([Oakgen](https://oakgen.ai/blog/advanced-ai-ugc-ad-workflow-2026))\n5. **Talking-head plus cutaways.** Hook on camera, then product / problem / demo. 30s avatar monologue looks cheap. ([Oakgen](https://oakgen.ai/blog/advanced-ai-ugc-ad-workflow-2026))\n\n## Kill / scale (vendor heuristics, unverified)\n\nKill hook rate under 20%. Scale variants 20%+ above account average. 2k-3k impressions before a pause call. Treat as vendor advice, not our data.\n\n## What this means for the next UGC partner\n\nCopy Mira's seller topics ([[growth-content-mira]]) into these hook families. Do not chase sandwich-style spectacle."}, {"id": "growth-trends", "label": "Trend radar", "layer": "trends", "color": "#22d3ee", "val": 8, "path": "growth/growth-trends.md", "body": "# Trend radar\n\nWeekly scan. Hub for [[growth-core]]. This week: [[growth-trend-2026-08-25]]."}, {"id": "growth-win-first-check", "label": "Win: first check (DEMO)", "layer": "memories", "color": "#f9a8d4", "val": 8, "path": "growth/growth-win-first-check.md", "body": "# Win: first check (DEMO)\n\nPartner: [[growth-partner-mira]]. Hub: [[growth-memories]].\n\nDEMO first check: $840 in month 1 from the $49/mo community plus two starter packs. Not a live payout.\n\n## Keep\n\nLand one partner. Set the offer by hand. Understand the flow before cloning the bot. Matches phase 1 in [[src-deronin-growthos-vault]]."}, {"id": "growth-win-referral", "label": "Win: referral loop (DEMO)", "layer": "memories", "color": "#f9a8d4", "val": 8, "path": "growth/growth-win-referral.md", "body": "# Win: referral loop (DEMO)\n\n[[growth-partner-mira]] introduced [[growth-partner-kai]] after the first check. Hub: [[growth-memories]].\n\nAsk for the intro at the happy moment, right after the first good check. Source: acquisition section in [[src-deronin-growthos-vault]]."}], "links": [{"source": "growth-competitors", "target": "growth-core"}, {"source": "growth-competitors", "target": "growth-ruling-     const side = document.getElementById('side');
    const labels = document.getElementById('labels');
    function openNote(node) {
      document.getElementById('crumb').textContent = node.path;
      document.getElementById('title').textContent = node.label;
      document.getElementById('meta').textContent = node.layer + ' · ' + node.id;
      document.getElementById('body').textContent = node.body;
      side.classList.add('open');
    }
    document.getElementById('close').onclick = () => side.classList.remove('open');
    const Graph = ForceGraph3D()(document.getElementById('graph'))
      .graphData(DATA)
      .backgroundColor('#050508')
      .showNavInfo(false)
      .linkColor(() => 'rgba(244,114,182,0.45)')
      .linkWidth(0.6)
      .linkOpacity(0.5)
      .nodeRelSize(5)
      .nodeVal('val')
      .nodeColor('color')
      .nodeOpacity(1)
      .nodeLabel(n => n.label)
      .onNodeClick(openNote);
    Graph.d3Force('charge').strength(-180);
    Graph.d3Force('link').distance(56);
    Graph.cameraPosition({ x: 0, y: 80, z: 520 });
    function paintLabels() {
      const nodes = Graph.graphData().nodes;
      if (!labels.childElementCount) {
        nodes.forEach(node => {
          const el = document.createElement('div');
          el.className = 'nlabel';
          el.textContent = node.label.replace(/^#\s*/, '');
          el.style.color = node.color;
          el.dataset.id = node.id;
          labels.appendChild(el);
        });
      }
      const kids = labels.children;
      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        const el = kids[i];
        if (node.x == null) continue;
        const c = Graph.graph2ScreenCoords(node.x, node.y, node.z);
        el.style.left = c.x + 'px';
        el.style.top = c.y + 'px';
      }
    }
    Graph.onEngineTick(paintLabels);
    let angle = 0;
    let holding = false;
    let ready = false;
    Graph.onEngineStop(() => { ready = true; paintLabels(); });
    setTimeout(() => { ready = true; }, 2500);
    const dist = 480;
    setInterval(() => {
      if (holding || !ready) return;
      angle += 0.004;
      Graph.cameraPosition({
        x: dist * Math.sin(angle),
        z: dist * Math.cos(angle),
        y: 60
      });
      paintLabels();
    }, 40);
    window.addEventListener('pointerdown', () => { holding = true; });
    window.addEventListener('pointerup', () => { holding = false; });
    window.GROWTHOS = {
      open: (id) => {
        const node = DATA.nodes.find(n => n.id === id);
        if (node) openNote(node);
      },
      data: DATA
    };
  </script>
</body>
