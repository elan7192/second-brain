rowth-playbook-content]] : write for sales, not views\n- [[growth-playbook-whop]] : offer wiring. Do not run live.\n- [[growth-playbook-outreach]] : hole they already see. Do not send.\n\nHuman gate: D5. These are files. They are not permission to post, pay, or send."}, {"kind": "file", "name": "scout.md", "abbr": "SC", "right": "1 KB", "body": "# Playbook: scout\n\nFilled prompt from [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]].\n\n```yaml\nFind 20 AI UGC creators on TikTok and Instagram that fit all of this:\n - they post their own AI video creatives (brand ads, product hooks) and it's getting positive feedback\n - no visible offer: no link in bio to a service, course, or community\n - for each one give me: handle, link to their best video, why the creative is strong, and what's broken in their distribution in one line\n - public profiles only\n - note any mention of working with products and of results\n```\n\n## After the list\n\nRead the profiles yourself the first few times. The bot will call average work \"strong\". Tune the bar. See [[growth-ruling-proof]].\n\nFile each keep as a scout note under [[growth-creators]]. File each pass with a one-line why."}, {"kind": "file", "name": "content.md", "abbr": "CT", "right": "1 KB", "body": "# Playbook: content engine\n\nFilled prompt from [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]].\n\n```yaml\nHere's the creator's profile: [link]. Here's their offer: [what we're selling, price]. Analyze their last 20 videos and 20 videos from the top people in this niche\n- for each one: topic, hook, view count, and whether it leads to an offer sale or just pulls views\n- find the gap: which topics pull views, and which actually push someone to buy\n- give me 10 video or tweets ideas, each one built to sell the offer, with a hook in the first 3 seconds\n- under each: why it converts, instead of just collecting likes\n```\n\n## Lesson already in the vault\n\nA views winner can be a sales loser. Chess example on [[growth-insights]]. DEMO rows: [[growth-content-mira]], [[growth-content-kai]].\n\nThis week's formats: [[growth-trend-2026-08-25]]."}, {"kind": "file", "name": "whop.md", "abbr": "WH", "right": "1 KB", "body": "# Playbook: Whop CLI\n\nCommand shapes from [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]]. **Do not run against a live account from this vault.**\n\n## Setup prompt (human pastes)\n\nInstall the Whop CLI, sign in, and run `whop skills add`\n- then run `whop --llms` and say in your own words what you can and cannot do with this login\n- list what is already on this account. If you find products the human did not create, leave them alone and report them\n- report anything Whop turns on by default that was not asked for\n\n## Offer prompt (AI UGC example)\n\n```yaml\nSet up the offer on Whop for this creator:\n- AI UGC Community, $49/mo, subscription\n- Starter Pack (templates + presets), $149, one time\n- 1:1 Audit, $299, one time\n- create a checkout link for each one and give me the three URLs\n- don't touch anything belonging to another business on this account\n```\n\n## Commands cited\n\n```bash\nwhop products list\nwhop plans create --help\nwhop checkout-configurations create --plan_id plan_xxx\nwhop stats time_series\n```\n\nEvery command takes `--format json`. See [[growth-ruling-no-money]]."}, {"kind": "file", "name": "outreach.md", "abbr": "OR", "right": "1 KB", "body": "# Playbook: outreach that does not sound like outreach\n\nFrom [[src-deronin-growthos-vault]]. Hub: [[growth-playbooks]]. **Do not send.** File drafts only.\n\nYou do not write \"hi, I offer services.\" You write to the person about a hole they already see.\n\n## Shape\n\n1. Name one specific piece of their work (video, hook, craft).\n2. Name the hole: no offer, no checkout, views that do not sell.\n3. One line on the system: distribution plus a Whop offer, rev-share, they keep the skill.\n4. Ask for a 15-minute look at their last 10 videos. No deck.\n\n## What alr     const PANELS = DATA.panels;
    const side = document.getElementById("side");

    const history = [];

    (function noteBadge() {

      const m = n.match(/(\d+)\s*notes/i);
      if (m) document.getElementById("notecount").textContent = m[1] + " NOTES";
    })();

    function openSide() {
      side.style.visibility = "visible";
      side.style.transform = "translateX(0)";
      side.style.transition = reduce ? "none" : "transform 0.35s ease";
    }
    function closeSide() {
      side.style.transform = "translateX(110%)";
      side.style.transition = reduce ? "none" : "transform 0.3s ease";
      setTimeout(() => { side.style.visibility = "hidden"; }, 320);
    }
    function renderPanel(id) {
      const p = PANELS[id];
      if (!p) return;
      document.getElementById("crumb").textContent = p.crumb;
      document.getElementById("title").textContent = p.title;
      document.getElementById("meta").textContent = p.meta;
      filesEl.innerHTML = "";
      noteEl.classList.remove("show");
      noteEl.textContent = "";
      (p.items || []).forEach((item) => {
        const li = document.createElement("li");
        li.innerHTML = '<div class="abbr"></div><div class="fname"></div><div class="' +
          (item.kind === "folder" ? "cnt" : "sz") + '"></div>';
        li.querySelector(".abbr").textContent = item.abbr;
        li.querySelector(".fname").textContent = item.name;
        li.lastChild.textContent = item.right;
        li.onclick = () => {
          filesEl.querySelectorAll("li").forEach((n) => n.classList.remove("active"));
          li.classList.add("active");
          if (item.open) { history.push(id); renderPanel(item.open); }
          else if (item.body) { noteEl.textContent = item.body; noteEl.classList.add("show"); }
        };
        filesEl.appendChild(li);
      });
      openSide();
    }
    document.getElementById("close").onclick = () => closeSide();
    document.getElementById("back").onclick = () => {
      const prev = history.pop();
      if (prev) renderPanel(prev); else closeSide();
    };
    document.getElementById("corepill").onclick = () => { history.length = 0; renderPanel("core"); };
    document.querySelectorAll("[data-open]").forEach((el) => {
      el.onclick = () => { history.length = 0; renderPanel(el.dataset.open); };
    });

      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return s - Math.floor(s);
    }
    const metalTex = canvasTex(512, (ctx, s) => {
      const g = ctx.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, "#1a1014"); g.addColorStop(0.5, "#0a0608"); g.addColorStop(1, "#241018");
      ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 1800; i++) {
        const x = hash(i, 1) * s, y = hash(i, 2) * s;
        ctx.fillStyle = "rgba(255,45,146," + (0.02 + hash(i, 3) * 0.08) + ")";
        ctx.fillRect(x, y, 1 + hash(i, 4) * 18, 1);
      }
    });
    const nebulaTex = canvasTex(1024, (ctx, s) => {
      ctx.fillStyle = "#030108"; ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 900; i++) {
        ctx.fillStyle = "rgba(255,255,255," + (0.15 + hash(i, 9) * 0.7) + ")";
        ctx.fillRect(hash(i, 5) * s, hash(i, 6) * s, hash(i, 7) > 0.97 ? 2 : 1, 1);
      }
      for (let k = 0; k < 8; k++) {
        const x = s * (0.2 + hash(k, 11) * 0.6);
        const y = s * (0.25 + hash(k, 12) * 0.5);
        const r = 80 + hash(k, 13) * 220;
        const grd = ctx.createRadialGradient(x, y, 0, x, y, r);
        const col = k % 2 ? "255,45,146" : "90,40,255";
        grd.addColorStop(0, "rgba(" + col + ",0.28)");
        grd.addColorStop(1, "rgba(" + col + ",0)");
        ctx.fillStyle = grd; ctx.fillRect(0, 0, s, s);
      }
    });
    function planetTex(kind) {
      const pal = {
        lava: ["#2a0a00", "#ff6a1a", "#ffd27a"],
        crystal: ["#04160a", "#22c55e", "#b7ffd0"],
        plasma: ["#2a0018", "#ff2d92", "#ffd0ea"],
        ice: ["#021018", "#3b9fff", "#d4f0ff"],
      }[kind] || ["#111", "#888", "#fff"];
      return canvasTex(256, (ctx, s) => {
        ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, s, s);
        for (let i = 0; i < 400; i++) {
          ctx.fillStyle = hash(i, 20) > 0.5 ? pal[1] : pal[2];
          ctx.globalAlpha = 0.15 + hash(i, 21) * 0.5;
          ctx.beginPath();
          ctx.arc(hash(i, 22) * s, hash(i, 23) * s, 2 + hash(i, 24) * 14, 0, 6.28);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      });
    }

    function makeTaperTube(curve, tubular, radial, r0, seed) {
      const frames = curve.computeFrenetFrames(tubular, false);
      const pos = [], nrm = [], uv = [], idx = [];
      for (let i = 0; i <= tubular; i++) {
        const t = i / tubular;
        const shaft = r0 * Math.pow(1 - t, 0.62) + 0.02;
        const club = Math.exp(-Math.pow((t - 0.8) / 0.1, 2)) * r0 * 1.15;
        const p = curve.getPointAt(t);
        const N = frames.normals[i], B = frames.binormals[i];
        for (let j = 0; j <= radial; j++) {
          const a = (j / radial) * Math.PI * 2;
          const organic = 1 + 0.16 * Math.sin(a * 3 + t * 10 + seed) * Math.sin(t * 6);
          const r = Math.max(0.01, (shaft + club) * organic);
          const nx = N.x * Math.cos(a) + B.x * Math.sin(a);
          const ny = N.y * Math.cos(a) + B.y * Math.sin(a);
          const nz = N.z * Math.cos(a) + B.z * Math.sin(a);
          pos.push(p.x + nx * r, p.y + ny * r, p.z + nz * r);
          nrm.push(nx, ny, nz);
          uv.push(j / radial, t);
        }
      }
      const cols = radial + 1;
      for (let i = 0; i < tubular; i++) for (let j = 0; j < radial; j++) {
        const a = i * cols + j, b = a + cols;
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute("normal", new THREE.Float32BufferAttribute(nrm, 3));
      g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }
    function perp(dir, seed) {
      const up = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const a = new THREE.Vector3().crossVectors(dir, up).normalize();
      const b = new THREE.Vector3().crossVectors(dir, a).normalize();
      const ang = seed * 6.28318530718;
      return a.multiplyScalar(Math.cos(ang)).add(b.multiplyScalar(Math.sin(ang)));
    }
    function tentacleCurve(index, total) {
      const phi = Math.acos(1 - (2 * (index + 0.5)) / total);
      const theta = Math.PI * (1 + Math.sqrt(5)) * index;
      const dir = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.cos(phi) * 0.72,
        Math.sin(phi) * Math.sin(theta)
      );
      if (index % 3 === 0) dir.z += 1.6;
      if (index % 5 === 1) dir.y -= 0.4;
      dir.normalize();
      const len = 8.6 + (index % 5) * 1.35;
      const side = perp(dir, index * 0.37);
      const pts = [];
      for (let i = 0; i <= 8; i++) {
        const t = i / 8;
        const p = dir.clone().multiplyScalar(CORE_R * 0.96 + len * t);
        p.add(side.clone().multiplyScalar(Math.sin(t * Math.PI * (1.05 + (index % 3) * 0.28)) * (0.12 + t * t * 2.4)));
        pts.push(p);
      }
      return new THREE.CatmullRomCurve3(pts);
    }
    function foregroundCurve(i) {
      const corners = [[-1, 0.82], [1, 0.88], [-1.12, 0.04], [1.12, -0.02], [-0.82, -0.95], [0.78, -1]];
      const sx = corners[i][0], sy = corners[i][1];
      return new THREE.CatmullRomCurve3([
        new THREE.Vector3(sx * 0.55, sy * 0.5, CORE_R * 0.92),
        new THREE.Vector3(sx * 1.7, sy * 1.45, 2.7),
        new THREE.Vector3(sx * 2.7, sy * 2.2, 3.7),
        new THREE.Vector3(sx * 3.35, sy * 2.7, 4.7),
        new THREE.Vector3(sx * 3.7, sy * 3.0, 5.45),
      ]);
    }

    function kindOf(node) {
      const c = (node.color || "").toLowerCase();
      if (/4ade80|22c55e/.test(c)) return "crystal";
      if (/38bdf8|7aa2ff|2ee6d6|5ecbff/.test(c)) return "ice";
      if (/ffe566|ff9f1a|fde047|ffc43d/.test(c)) return "lava";
      return "plasma";
    }
    const GLOW = { lava: "#ff6a1a", crystal: "#22c55e", plasma: "#ff2d92", ice: "#3b9fff" };

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x050308, 1);
    if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.localClippingEnabled = true;
    document.body.prepend(renderer.domElement);
    renderer.domElement.style.cssText = "position:absolute;inset:0;z-index:1;touch-action:none";

    const scene = new THREE.Scene();
    nebulaTex.mapping = THREE.EquirectangularReflectionMapping;
    scene.background = nebulaTex;
    scene.environment = nebulaTex;
    scene.fog = new THREE.FogExp2(0x030108, 0.012);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 120);
    let theta = 0.02, phi = 1.48, dist = 6.7;
    const look = new THREE.Vector3(0, 0.08, 0);
    function placeCam() {
      camera.position.set(
        dist * Math.sin(phi) * Math.sin(theta),
        dist * Math.cos(phi) + 0.15,
        dist * Math.sin(phi) * Math.cos(theta)
      );
      camera.lookAt(look);
    }
    placeCam();

    scene.add(new THREE.AmbientLight(0x3a1428, 0.28));
    scene.add(new THREE.HemisphereLight(0xff6ab5, 0x070614, 0.55));
    const key = new THREE.DirectionalLight(0xfff1ff, 1.15); key.position.set(10, 14, 16); scene.add(key);
    const fill = new THREE.DirectionalLight(0x5ecbff, 0.35); fill.position.set(-12, -6, -8); scene.add(fill);
    const viewLight = new THREE.PointLight(0xffe6f4, 2.2, 28, 2); scene.add(viewLight);

    const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 1.42);
    const coreGroup = new THREE.Group();
    scene.add(coreGroup);
    const shellMat = new THREE.MeshStandardMaterial({
      map: metalTex, color: 0x14080e, metalness: 0.98, roughness: 0.16,
      envMapIntensity: 1.8, emissive: 0x4a1428, emissiveIntensity: 0.42,
      side: THREE.DoubleSide, clippingPlanes: [clipPlane], clipShadows: true,
    });
    const shell = new THREE.Mesh(new THREE.SphereGeometry(CORE_R, 80, 80), shellMat);
    coreGroup.add(shell);
    coreGroup.add(new THREE.Mesh(
      new THREE.SphereGeometry(CORE_R * 1.06, 48, 48),
      new THREE.MeshBasicMaterial({ color: 0xff2d92, transparent: true, opacity: 0.07, side: THREE.BackSide, depthWrite: false })
    ));
    [[CORE_R * 1.08, 0.028], [CORE_R * 1.2, 0.018], [CORE_R * 1.34, 0.012]].forEach((pair, i) => {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(pair[0], pair[1], 10, 96),
        new THREE.MeshStandardMaterial({
          map: metalTex, color: 0x1a0c12, metalness: 1, roughness: 0.14,
          emissive: 0xff2d92, emissiveIntensity: 0.35,
        })
      );
      ring.rotation.set(Math.PI / 2, i * 0.42, i * 0.18);
      coreGroup.add(ring);
    });
    const iris = new THREE.Group();
    scene.add(iris);
    for (let i = 0; i < 11; i++) {
      const t = i / 10;
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.55 * (1 - t * 0.86) + 0.12, 0.026 + (1 - t) * 0.018, 10, 80),
        new THREE.MeshStandardMaterial({
          color: 0x1a0a12, metalness: 1, roughness: 0.12,
          emissive: 0xff2d92, emissiveIntensity: 0.55 + (1 - t) * 0.5,
        })
      );
      ring.position.z = 1.22 - t * 1.28;
      iris.add(ring);
    }
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(0.48, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffe6f4 })
    );
    iris.add(glow);
    iris.add(new THREE.Mesh(
      new THREE.SphereGeometry(0.78, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff2d92, transparent: true, opacity: 0.45, depthWrite: false })
    ));
    iris.add(new THREE.PointLight(0xff2d92, 14, 36, 2));

    const tentMat = new THREE.MeshStandardMaterial({
      map: metalTex, color: 0x0a0508, metalness: 0.98, roughness: 0.16,
      envMapIntensity: 1.5, emissive: 0xff2d92, emissiveIntensity: 0.08,
    });
    const veinMat = new THREE.MeshBasicMaterial({
      color: 0xff4da6, transparent: true, opacity: 0.55,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const tentacles = [];
    function addTentacle(curve, r0, seed) {
      const shellG = makeTaperTube(curve, 48, 12, r0, seed);
      const veinG = makeTaperTube(curve, 36, 8, r0 * 0.22, seed);
      const a = new THREE.Mesh(shellG, tentMat);
      const b = new THREE.Mesh(veinG, veinMat);
      scene.add(a, b);
      tentacles.push(shellG, veinG);
    }
    for (let i = 0; i < 16; i++) addTentacle(tentacleCurve(i, 16), 0.62 + (i % 5) * 0.1, i * 1.7);
    for (let i = 0; i < 6; i++) addTentacle(foregroundCurve(i), 0.95 + (i % 3) * 0.12, 20 + i);

    const nodeMeshes = [];
    const SCALE = 0.072;
    const texCache = { lava: planetTex("lava"), crystal: planetTex("crystal"), plasma: planetTex("plasma"), ice: planetTex("ice") };
    DATA.nodes.forEach((node) => {
      if (node.id === "core") return;
      const kind = kindOf(node);
      const glowC = GLOW[kind];
      const r = Math.max(0.22, (node.val || 2.2) * 0.16);
      const g = new THREE.Group();
      g.position.set((node.x || 0) * SCALE, (node.y || 0) * SCALE, (node.z || 0) * SCALE);
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(r, 48, 48),
        new THREE.MeshStandardMaterial({
          map: texCache[kind], roughness: 0.28, metalness: 0.18,
          emissive: new THREE.Color(glowC), emissiveMap: texCache[kind], emissiveIntensity: 0.7,
        })
      );
      mesh.userData.panel = node.panel;
      g.add(mesh);
      g.add(new THREE.Mesh(
        new THREE.SphereGeometry(r * 1.16, 24, 24),
        new THREE.MeshBasicMaterial({ color: glowC, transparent: true, opacity: 0.12, side: THREE.BackSide, depthWrite: false })
      ));
      g.add(new THREE.PointLight(glowC, 1.5, 6));
      scene.add(g);
      nodeMeshes.push({ mesh, spin: 0.12 + r * 0.08 });
    });

    const clusters = [
      ["n-ugc", "n-ops"],
      ["partner-1", "partner-2", "partner-3"],
      ["playbooks", "creators", "trends"],
    ];
    const byId = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
    clusters.forEach((ids) => {
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const a = byId[ids[i]], b = byId[ids[j]];
        if (!a || !b) continue;
        const va = new THREE.Vector3(a.x * SCALE, a.y * SCALE, a.z * SCALE);
        const vb = new THREE.Vector3(b.x * SCALE, b.y * SCALE, b.z * SCALE);
        const dir = vb.clone().sub(va);
        const len = dir.length();
        const geo = new THREE.CylinderGeometry(0.03, 0.03, len, 6);
        const rod = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
          color: a.color, metalness: 0.9, roughness: 0.25, emissive: a.color, emissiveIntensity: 0.3,
        }));
        rod.position.copy(va).add(vb).multiplyScalar(0.5);
        rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        scene.add(rod);
      }
    });

    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(2500 * 3);
    for (let i = 0; i < 2500; i++) {
      const r = 40 + Math.random() * 50;
      const a = Math.random() * 6.28, b = Math.acos(2 * Math.random() - 1);
      starPos[i * 3] = r * Math.sin(b) * Math.cos(a);
      starPos[i * 3 + 1] = r * Math.cos(b);
      starPos[i * 3 + 2] = r * Math.sin(b) * Math.sin(a);
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.7 })));

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let dragging = false, lastX = 0, lastY = 0, auto = !reduce;
    renderer.domElement.addEventListener("pointerdown", (e) => {
      dragging = false;
      lastX = e.clientX; lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener("pointermove", (e) => {
      if (e.buttons) {
        dragging = true; auto = false;
        theta -= (e.clientX - lastX) * 0.005;
        phi = Math.min(Math.PI * 0.88, Math.max(Math.PI * 0.14, phi - (e.clientY - lastY) * 0.005));
        lastX = e.clientX; lastY = e.clientY;
      }
    });
    renderer.domElement.addEventListener("pointerup", (e) => {
      if (dragging) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(nodeMeshes.map((n) => n.mesh), false);
      if (hits.length) {
        history.length = 0;
        renderPanel(hits[0].object.userData.panel);
      } else {
        const coreHit = raycaster.intersectObject(shell, false);
        if (coreHit.length) { history.length = 0; renderPanel("core"); }
      }
    });
    renderer.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      dist = Math.min(16, Math.max(4.6, dist + e.deltaY * 0.008));
    }, { passive: false });

    const _dir = new THREE.Vector3();
    const clock = new THREE.Clock();
    function tick() {
      const dt = Math.min(clock.getDelta(), 0.1);
      if (auto && !reduce) theta += dt * 0.045;
      placeCam();
      _dir.copy(camera.position).normalize();
      clipPlane.normal.copy(_dir).negate();
      clipPlane.constant = 1.42;
      iris.lookAt(camera.position);
      viewLight.position.copy(camera.position);
      coreGroup.rotation.y += dt * 0.04;
      const pulse = 1 + Math.sin(clock.elapsedTime * 1.6) * 0.08;
      glow.scale.setScalar(pulse);
      nodeMeshes.forEach((n) => { n.mesh.rotation.y += dt * n.spin; });
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    tick();
    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    window.GROWTHOS = { open: (id) => renderPanel(id), data: DATA };
  </script>
</body>
</html>
