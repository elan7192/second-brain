    .bus .ports b {

    .bus label {

    }
    footer {

    .log i { color: var(--gold); font-style: normal; }

    .w .bad { color: var(--warn); }
    .cost { font-size: 10px; color: var(--mute); display: grid; gap: 4px; }
    .cost b { color: var(--ink); font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--gold); }
