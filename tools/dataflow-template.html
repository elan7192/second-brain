<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Second brain · dataflow</title>
  <style>
    :root {
      --bg: #07080a;
      --panel: #0c0e12;
      --node: #12151a;
      --ink: #e6e1d8;
      --mute: #8a8680;
      --line: rgba(236, 232, 224, 0.22);
      --line-hot: rgba(236, 232, 224, 0.55);
      --gold: #c8a24a;
      --ok: #6f8f5a;
      --warn: #c45a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { overflow: hidden; }
    .hud {
      position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 4;
      display: flex; align-items: center; gap: 22px; padding: 0 16px;
      background: #050608; border-bottom: 1px solid #1a1c20; font-size: 11px; letter-spacing: 0.04em;
    }
    .hud b { color: var(--gold); font-weight: 500; }
    .hud span { color: var(--mute); }
    .hud em { color: var(--ink); font-style: normal; }
    #stage { position: absolute; inset: 28px 0 148px 0; }
    #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .node {
      position: absolute; width: 188px; background: var(--node);
      border: 1px solid #22262c; box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    }
    .node header {
      padding: 5px 8px; font-size: 11px; letter-spacing: 0.03em; color: #f3efe6;
      border-bottom: 1px solid rgba(0,0,0,0.35);
    }
    .node .body { padding: 6px 8px 7px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 10px; color: var(--mute); }
    .row .k { width: 62px; flex: none; }
    .row .v { margin-left: auto; color: var(--ink); min-width: 28px; text-align: right; }
    .bar { flex: 1; height: 4px; background: #1c2026; overflow: hidden; }
    .bar i { display: block; height: 100%; background: currentColor; }
    .bus {
      position: absolute; width: 34px; background: #101214; border: 1px solid #2a2d33;
    }
    .bus .spine { position: absolute; inset: 8px 12px; background: #0a0b0d; border-left: 1px solid #3a3324; }
    .bus .ports { position: absolute; inset: 10px 0; }
    .bus .ports b {
      position: absolute; left: 6px; width: 22px; height: 2px; background: var(--gold); opacity: 0.7;
    }
    .bus label {
      position: absolute; left: 50%; bottom: 10px; transform: rotate(-90deg) translateX(-50%);
      transform-origin: left center; font-size: 10px; color: #b9b3a8; white-space: nowrap; letter-spacing: 0.08em;
    }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0; height: 148px; z-index: 4;
      display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; padding: 10px 12px 12px;
      background: #050608; border-top: 1px solid #1a1c20;
    }
    .panel { background: var(--panel); border: 1px solid #1c2026; padding: 8px 10px; overflow: hidden; }
    .panel h2 { margin: 0 0 6px; font-size: 10px; color: var(--mute); font-weight: 500; letter-spacing: 0.12em; }
    .log { margin: 0; font-size: 10px; line-height: 1.45; color: #c8c3ba; }
    .log i { color: var(--gold); font-style: normal; }
    .workers { display: grid; gap: 3px; }
    .w { display: grid; grid-template-columns: 22px 1fr 54px; gap: 8px; align-items: center; font-size: 10px; color: var(--mute); }
    .w .bar { height: 5px; }
    .w .ok { color: var(--ok); }
    .w .bad { color: var(--warn); }
    .cost { font-size: 10px; color: var(--mute); display: grid; gap: 4px; }
    .cost b { color: var(--ink); font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <div class="hud" id="hud"></div>
  <div id="stage">
    <svg id="wires"></svg>
  </div>
  <footer>
    <section class="panel">
      <h2>RUN LOG</h2>
      <pre class="log" id="log"></pre>
    </section>
    <section class="panel">
      <h2>DISPATCH</h2>
      <div class="workers" id="workers"></div>
    </section>
    <section class="panel">
      <h2>GRAPH COST</h2>
      <div class="cost" id="cost"></div>
    </section>
  </footer>
  <script>
  const data = __PAYLOAD__;
  const stage = document.getElementById('stage');
  const svg = document.getElementById('wires');
  const NS = 'http://www.w3.org/2000/svg';

  document.getElementById('hud').innerHTML = data.hud.map(([k,v]) =>
    `<span>${k} <em>${v}</em></span>`
  ).join('') + `<span style="margin-left:auto">gold wiki · teal maps · blue hunt · green people · coral ship</span>`;

  document.getElementById('log').innerHTML = data.log.map(line =>
    `<i>${line.t}</i>  ${line.m}`
  ).join('\n');

  document.getElementById('workers').innerHTML = data.workers.map(w => `
    <div class="w">
      <span>${w.id}</span>
      <div class="bar" style="color:${w.ok ? 'var(--ok)' : 'var(--warn)'}"><i style="width:${w.pct}%"></i></div>
      <span class="${w.ok ? 'ok' : 'bad'}">${w.label}</span>
    </div>
  `).join('');

  document.getElementById('cost').innerHTML = data.cost.map(([k,v]) =>
    `<div>${k} <b>${v}</b></div>`
  ).join('');

  const box = {};
  for (const n of data.nodes) {
    const el = document.createElement('div');
    el.className = n.kind === 'bus' ? 'bus' : 'node';
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    if (n.kind === 'bus') {
      el.style.height = n.h + 'px';
      const ports = Array.from({length: 22}, (_, i) =>
        `<b style="top:${(i + 0.6) * (n.h - 36) / 22}px"></b>`
      ).join('');
      el.innerHTML = `<div class="spine"></div><div class="ports">${ports}</div><label>${n.title}</label>`;
    } else {
      el.style.width = (n.w || 188) + 'px';
      const rows = (n.rows || []).map(r => `
        <div class="row" style="color:${r.color || 'var(--mute)'}">
          <span class="k">${r.k}</span>
          <div class="bar"><i style="width:${Math.max(6, Math.min(100, r.bar))}%"></i></div>
          <span class="v">${r.v}</span>
        </div>`).join('');
      el.innerHTML = `<header style="background:${n.color}"><a href="${n.href}">${n.title}</a></header><div class="body">${rows}</div>`;
    }
    stage.appendChild(el);
    box[n.id] = { ...n, el };
  }

  function port(n, side, t) {
    const w = n.kind === 'bus' ? 34 : (n.w || 188);
    const h = n.kind === 'bus' ? n.h : n.el.offsetHeight;
    const x = n.x + (side === 'left' ? 0 : w);
    const y = n.y + 18 + (h - 28) * t;
    return [x, y];
  }

  const paths = [];
  for (const e of data.edges) {
    const a = box[e.from], b = box[e.to];
    if (!a || !b) continue;
    const [x1, y1] = port(a, e.fromSide || 'right', e.t0);
    const [x2, y2] = port(b, e.toSide || 'left', e.t1);
    const mid = (x1 + x2) / 2;
    const d = `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', e.hot ? 'rgba(236,232,224,0.42)' : 'rgba(236,232,224,0.16)');
    p.setAttribute('stroke-width', e.hot ? '1.15' : '0.85');
    svg.appendChild(p);
    paths.push({ el: p, len: p.getTotalLength(), hot: !!e.hot });
  }

  const dots = paths.filter(p => p.hot).map(p => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', '1.7');
    c.setAttribute('fill', '#e6e1d8');
    svg.appendChild(c);
    return { p, c, t: Math.random() };
  });

  function tick(now) {
    for (const d of dots) {
      d.t = (d.t + 0.0045) % 1;
      const pt = d.p.el.getPointAtLength(d.p.len * d.t);
      d.c.setAttribute('cx', pt.x);
      d.c.setAttribute('cy', pt.y);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  </script>
</body>
</html>
