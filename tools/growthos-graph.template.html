<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GROWTHOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: "Space Grotesk", sans-serif; }
    #graph { position: absolute; inset: 0; z-index: 1; }
    #nebula {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 42% 36% at 44% 48%, rgba(255, 20, 120, 0.16), transparent 58%),
        radial-gradient(ellipse 34% 30% at 66% 36%, rgba(90, 40, 255, 0.12), transparent 52%),
        radial-gradient(ellipse 28% 24% at 58% 72%, rgba(255, 190, 40, 0.07), transparent 50%),
        radial-gradient(ellipse 24% 22% at 28% 70%, rgba(40, 180, 255, 0.07), transparent 50%);
      filter: blur(36px);
    }
    #brand {
      position: absolute; top: 28px; left: 32px; z-index: 4;
      display: flex; flex-direction: column; gap: 6px;
    }
    #brand .markrow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    #brand .short {
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.22em; color: #ff2d92;
    }
    #brand .mark {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff2d92; box-shadow: 0 0 12px #ff2d92;
    }
    #brand h1 {
      margin: 0; font-family: Orbitron, sans-serif; font-weight: 800;
      font-size: 28px; letter-spacing: 0.18em; color: #ff2d92;
      text-shadow: 0 0 18px rgba(255, 45, 146, 0.9), 0 0 40px rgba(255, 45, 146, 0.45);
    }
    #brand .sub {
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.22em; color: rgba(255,255,255,0.55);
      text-transform: uppercase;
    }
    #hint {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 4; font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.28em; color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }
    #pills {
      position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
      z-index: 4; display: flex; gap: 10px;
    }
    .status {
      font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 999px;
    }
    .status.amber { background: #ffc43d; color: #1a1200; box-shadow: 0 0 16px rgba(255,196,61,0.55); }
    .status.pink { background: #ff2d92; color: #fff; box-shadow: 0 0 16px rgba(255,45,146,0.55); }
    #side {
      position: absolute; top: 0; right: 0; width: min(380px, 42vw); height: 100%;
      z-index: 5;
      background: rgba(6, 4, 10, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-left: 1px solid rgba(255, 45, 146, 0.55);
      box-shadow: -20px 0 60px rgba(255, 20, 120, 0.12);
      padding: 22px 22px 40px;
      overflow: auto;
      visibility: hidden;
      will-change: transform;
    }
    #side .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #side .crumb {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      color: rgba(255,255,255,0.45); letter-spacing: 0.04em;
    }
    #side h2 {
      margin: 4px 0 4px; font-size: 26px; letter-spacing: 0.08em;
      color: #ff4da6; font-weight: 700; text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255,45,146,0.5);
    }
    #side .meta {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      color: rgba(255,255,255,0.4); margin-bottom: 18px;
    }
    .icon-btn {
      background: none; border: 0; color: rgba(255,255,255,0.5);
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    .icon-btn:hover { color: #fff; }
    .files { list-style: none; margin: 0; padding: 0; }
    .files li {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 10px;
      align-items: center; padding: 9px 8px; margin-bottom: 4px;
      border-radius: 8px; cursor: pointer;
      border: 1px solid transparent;
    }
    .files li:hover, .files li.active {
      border-color: rgba(255, 45, 146, 0.55);
      background: rgba(255, 45, 146, 0.08);
      box-shadow: 0 0 18px rgba(255, 45, 146, 0.12);
    }
    .abbr {
      width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center;
      font-family: Orbitron, sans-serif; font-size: 8px; letter-spacing: 0.08em;
      background: linear-gradient(160deg, #ff4da6, #7a2bff);
      box-shadow: 0 0 14px rgba(255, 45, 146, 0.45);
    }
    .fname {
      font-family: "IBM Plex Mono", monospace; font-size: 13px; color: #f5f5f5;
    }
    .sz, .cnt {
      font-family: "IBM Plex Mono", monospace; font-size: 11px; color: rgba(255,255,255,0.35);
    }
    .note {
      display: none; margin-top: 16px; white-space: pre-wrap;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.5;
      color: rgba(255,255,255,0.72);
    }
    .note.show { display: block; }
    #labels { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
    #flare {
      position: absolute; left: 0; top: 0; width: 220px; height: 220px;
      pointer-events: none; z-index: 2; mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(255,255,255,0.28) 0%, rgba(255,45,146,0.12) 32%, transparent 70%);
      will-change: transform;
      opacity: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      #side { transition: none; }
    }
    #brand, #hint, #pills { will-change: transform, opacity; }
    .pill {
      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #fff; white-space: nowrap; cursor: pointer; pointer-events: auto;
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 4px; padding: 5px 9px;
      position: absolute; left: 0; top: 0;
      will-change: transform, opacity;
      background: rgba(255, 20, 120, 0.92);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 0 16px rgba(255, 20, 120, 0.55);
      font-size: 11px;
    }
    .pill.core {
      background: #fff; color: #ff2d92; font-size: 13px; padding: 7px 12px;
      box-shadow: 0 0 24px rgba(255,255,255,0.85), 0 0 48px rgba(255,45,146,0.8);
    }
    .pill.hub { font-size: 12px; padding: 6px 10px; }
    .pill.ruling {
      background: #ff9f1a; color: #1a0a00;
      box-shadow: 0 0 16px rgba(255,159,26,0.65);
    }
    .pill.metric {
      background: #ffe566; color: #1a1400;
      box-shadow: 0 0 16px rgba(255,229,102,0.55);
    }
    .pill.cyan {
      background: rgba(56, 189, 248, 0.92); color: #001018;
      box-shadow: 0 0 14px rgba(56,189,248,0.5);
    }
    .pill.violet {
      background: rgba(167, 139, 250, 0.95); color: #120024;
    }
    .pill.leaf {
      background: rgba(255, 20, 120, 0.55);
      font-size: 10px; letter-spacing: 0.1em;
    }
    .pill .n {
      font-size: 9px; letter-spacing: 0; opacity: 0.8; font-weight: 600;
    }
    .fold {
      width: 8px; height: 7px; border: 1.5px solid currentColor;
      border-radius: 1px 1px 0 0; display: inline-block; opacity: 0.85;
      position: relative;
    }
    .fold:after {
      content: ""; position: absolute; left: -1.5px; right: 2px; top: -3px;
      height: 2px; border: 1.5px solid currentColor; border-bottom: 0;
      border-radius: 1px 1px 0 0; width: 4px;
    }
  </style>
</head>
<body>
  <div id="nebula"></div>
  <div id="graph"></div>
  <div id="flare"></div>
  <div id="labels"></div>
  <div id="brand">
    <div class="markrow">
      <div class="mark"></div>
      <div class="short">SHORTLIST · 3</div>
    </div>
    <h1>GROWTHOS</h1>
    <div class="sub">Grokbot · Obsidian Vault · Second Brain</div>
  </div>
  <div id="pills">
    <div class="status amber">Costs must not scale</div>
    <div class="status pink">View-sale gap</div>
  </div>
  <div id="hint">DRAG TO ORBIT · SCROLL TO FLY · CLICK A NODE TO OPEN THE FILE</div>
  <aside id="side">
    <div class="top">
      <button class="icon-btn" id="back" type="button">←</button>
      <button class="icon-btn" id="close" type="button">×</button>
    </div>
    <div class="crumb" id="crumb"></div>
    <h2 id="title"></h2>
    <div class="meta" id="meta"></div>
    <ul class="files" id="files"></ul>
    <pre class="note" id="note"></pre>
  </aside>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.7/dist/gsap.min.js"></script>
  <script>
    const DATA = __GROWTH_DATA__;
    const PANELS = DATA.panels;
    const side = document.getElementById("side");
    const filesEl = document.getElementById("files");
    const noteEl = document.getElementById("note");
    const labels = document.getElementById("labels");
    const flare = document.getElementById("flare");
    const history = [];
    const hasGsap = typeof gsap !== "undefined";
    const reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
    function motionOff() { return reduceMq.matches; }

    function openSide() {
      if (hasGsap) gsap.to(side, { xPercent: 0, autoAlpha: 1, duration: motionOff() ? 0 : 0.45, ease: "power3.out", overwrite: true });
      else {
        side.style.transform = "translateX(0)";
        side.style.visibility = "visible";
      }
    }
    function closeSide() {
      if (hasGsap) gsap.to(side, { xPercent: 100, autoAlpha: 1, duration: motionOff() ? 0 : 0.35, ease: "power2.in", overwrite: true });
      else {
        side.style.transform = "translateX(110%)";
        side.style.visibility = "hidden";
      }
    }

    function renderPanel(id) {
      const p = PANELS[id];
      if (!p) return;
      document.getElementById("crumb").textContent = p.crumb;
      document.getElementById("title").textContent = p.title;
      document.getElementById("meta").textContent = p.meta;
      filesEl.innerHTML = "";
      noteEl.classList.remove("show");
      noteEl.textContent = "";
      (p.items || []).forEach((item) => {
        const li = document.createElement("li");
        const abbr = document.createElement("div");
        abbr.className = "abbr";
        abbr.textContent = item.abbr;
        const name = document.createElement("div");
        name.className = "fname";
        name.textContent = item.name;
        const right = document.createElement("div");
        right.className = item.kind === "folder" ? "cnt" : "sz";
        right.textContent = item.right;
        li.append(abbr, name, right);
        li.onclick = () => {
          document.querySelectorAll(".files li").forEach((n) => n.classList.remove("active"));
          li.classList.add("active");
          if (item.open) {
            history.push(id);
            renderPanel(item.open);
          } else if (item.body) {
            noteEl.textContent = item.body;
            noteEl.classList.add("show");
          }
        };
        filesEl.appendChild(li);
      });
      openSide();
    }

    document.getElementById("close").onclick = () => closeSide();
    document.getElementById("back").onclick = () => {
      const prev = history.pop();
      if (prev) renderPanel(prev);
      else closeSide();
    };

    function makeGlowTexture() {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const g = c.getContext("2d");
      const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grd.addColorStop(0, "rgba(255,255,255,1)");
      grd.addColorStop(0.12, "rgba(255,255,255,0.72)");
      grd.addColorStop(0.32, "rgba(255,255,255,0.22)");
      grd.addColorStop(0.58, "rgba(255,255,255,0.05)");
      grd.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = grd;
      g.fillRect(0, 0, 256, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;
      return tex;
    }

    function nodeRadius(node) {
      if (node.kind === "core") return 7.4;
      if (node.kind === "hub" || node.kind === "ruling" || node.kind === "metric") return 4.6;
      return 2.7;
    }

    const sphereGeo = new THREE.SphereGeometry(1, 64, 64);
    const glowTex = makeGlowTexture();
    const FRESNEL_VERT = [
      "varying vec3 vN;",
      "varying vec3 vV;",
      "void main() {",
      "  vec4 w = modelViewMatrix * vec4(position, 1.0);",
      "  vN = normalize(normalMatrix * normal);",
      "  vV = normalize(-w.xyz);",
      "  gl_Position = projectionMatrix * w;",
      "}"
    ].join("\n");
    const FRESNEL_FRAG = [
      "uniform vec3 uColor;",
      "uniform vec3 uRim;",
      "uniform float uCore;",
      "uniform float uPower;",
      "varying vec3 vN;",
      "varying vec3 vV;",
      "void main() {",
      "  vec3 n = normalize(vN);",
      "  vec3 v = normalize(vV);",
      "  float ndv = max(dot(n, v), 0.0);",
      "  float fres = pow(1.0 - ndv, uPower);",
      "  vec3 h = normalize(v + vec3(0.35, 0.72, 0.48));",
      "  float spec = pow(max(dot(n, h), 0.0), 56.0);",
      "  vec3 col = uColor * uCore * (0.35 + ndv * 0.65);",
      "  col += uRim * fres;",
      "  col += vec3(1.0) * spec * 0.72;",
      "  float alpha = mix(0.62, 1.0, fres);",
      "  gl_FragColor = vec4(col, alpha);",
      "}"
    ].join("\n");

    function makeNodeObject(node) {
      const r = nodeRadius(node);
      const group = new THREE.Group();
      const base = new THREE.Color(node.color);
      const rim = base.clone().lerp(new THREE.Color("#ffffff"), node.kind === "core" ? 0.62 : 0.28);
      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: base.clone().multiplyScalar(0.62) },
          uRim: { value: rim },
          uCore: { value: node.kind === "core" ? 0.7 : 0.42 },
          uPower: { value: node.kind === "core" ? 1.7 : 2.45 }
        },
        vertexShader: FRESNEL_VERT,
        fragmentShader: FRESNEL_FRAG,
        transparent: true,
        depthWrite: true
      });
      const mesh = new THREE.Mesh(sphereGeo, mat);
      mesh.scale.setScalar(r);
      group.add(mesh);

      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex,
        color: rim,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: node.kind === "core" ? 0.85 : 0.5,
        toneMapped: false
      }));
      const hs = r * (node.kind === "core" ? 5.8 : 4.0);
      halo.scale.set(hs, hs, 1);
      halo.renderOrder = -1;
      group.add(halo);

      if (node.kind === "core") {
        const inner = new THREE.Mesh(
          sphereGeo,
          new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })
        );
        inner.scale.setScalar(r * 0.32);
        group.add(inner);
        const coreHalo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowTex,
          color: 0xffffff,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0.55,
          toneMapped: false
        }));
        coreHalo.scale.set(r * 2.1, r * 2.1, 1);
        group.add(coreHalo);
      }
      return group;
    }

    const Graph = ForceGraph3D({
      rendererConfig: {
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      }
    })(document.getElementById("graph"))
      .graphData({ nodes: DATA.nodes, links: DATA.links })
      .backgroundColor("#000000")
      .showNavInfo(false)
      .linkColor(() => "rgba(255,110,190,0.22)")
      .linkWidth(0.45)
      .linkOpacity(0.55)
      .nodeRelSize(4)
      .nodeVal("val")
      .nodeOpacity(1)
      .nodeLabel(() => "")
      .nodeThreeObject(makeNodeObject)
      .onNodeClick((node) => {
        history.length = 0;
        renderPanel(node.panel);
      });

    const renderer = Graph.renderer();
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    if (THREE.ACESFilmicToneMapping) renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    if (THREE.SRGBColorSpace && renderer.outputColorSpace !== undefined) renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = Graph.scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0028);
    scene.add(new THREE.AmbientLight(0x3a1428, 0.7));
    scene.add(new THREE.HemisphereLight(0xff6ab5, 0x070614, 0.55));
    const key = new THREE.DirectionalLight(0xfff1ff, 1.15);
    key.position.set(48, 72, 36);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x5ecbff, 0.38);
    fill.position.set(-56, -18, -44);
    scene.add(fill);
    const rimLight = new THREE.DirectionalLight(0xff9a3c, 0.28);
    rimLight.position.set(10, -40, 60);
    scene.add(rimLight);
    const coreLight = new THREE.PointLight(0xff2d92, 2.4, 420, 2);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);

    Graph.d3Force("charge").strength(-110);
    Graph.d3Force("link").distance((l) => l.distance || 52);
    Graph.d3VelocityDecay(0.32);
    Graph.cameraPosition({ x: 36, y: 20, z: 210 });

    function ensureOverlay() {
      if (labels.childElementCount) return;
      Graph.graphData().nodes.forEach((node) => {
        const el = document.createElement("div");
        el.className = "pill " + node.kind;
        el.innerHTML = node.html;
        el.onclick = (ev) => {
          ev.stopPropagation();
          history.length = 0;
          renderPanel(node.panel);
        };
        labels.appendChild(el);
      });
    }

    function paint() {
      const nodes = Graph.graphData().nodes;
      ensureOverlay();
      let core = null;
      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        if (node.x == null) continue;
        const c = Graph.graph2ScreenCoords(node.x, node.y, node.z);
        const cam = Graph.camera();
        const dx = node.x - cam.position.x;
        const dy = node.y - cam.position.y;
        const dz = node.z - cam.position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const far = Math.max(0, (dist - 150) / 200);
        const lab = labels.children[i];
        lab.style.transform = "translate3d(" + c.x + "px," + (c.y - 18) + "px,0) translate(-50%,-100%)";
        lab.style.opacity = String(Math.max(0, 1 - far * 1.35));
        lab.style.visibility = far > 0.9 ? "hidden" : "visible";
        if (node.kind === "core") core = c;
      }
      if (core) {
        flare.style.transform = "translate3d(" + (core.x - 110) + "px," + (core.y - 110) + "px,0)";
        flare.style.opacity = "0.7";
      }
    }

    Graph.onEngineTick(paint);
    let angle = 0.35;
    let holding = false;
    let ready = false;
    Graph.onEngineStop(() => { ready = true; paint(); });
    setTimeout(() => { ready = true; }, 1800);
    const orbit = 220;
    if (!motionOff()) {
      setInterval(() => {
        if (holding || !ready) return;
        angle += 0.003;
        Graph.cameraPosition({
          x: orbit * Math.sin(angle),
          z: orbit * Math.cos(angle),
          y: 22,
        });
        paint();
      }, 40);
    }
    window.addEventListener("pointerdown", () => { holding = true; });
    window.addEventListener("pointerup", () => { holding = false; });

    if (hasGsap) {
      gsap.set(side, { xPercent: 100, autoAlpha: 1 });
      if (!motionOff()) {
        gsap.set("#brand", { autoAlpha: 0, y: -14 });
        gsap.set("#hint", { autoAlpha: 0 });
        gsap.set(".status", { autoAlpha: 0 });
        gsap.timeline({ defaults: { ease: "power3.out" } })
          .to("#brand", { autoAlpha: 1, y: 0, duration: 0.7 })
          .to(".status", { autoAlpha: 1, duration: 0.35, stagger: 0.08 }, "-=0.35")
          .to("#hint", { autoAlpha: 1, duration: 0.45 }, "-=0.2");
      }
    } else {
      side.style.transform = "translateX(110%)";
    }

    window.GROWTHOS = { open: (id) => renderPanel(id), data: DATA };
  </script>
</body>
</html>
