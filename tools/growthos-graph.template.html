<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GROWTHOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Orbitron:wght@700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: "Space Grotesk", sans-serif; }
    #graph { position: absolute; inset: 0; z-index: 1; }
    #nebula {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 50% 40% at 42% 48%, rgba(255, 20, 120, 0.22), transparent 55%),
        radial-gradient(ellipse 40% 35% at 68% 38%, rgba(90, 40, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 35% 30% at 58% 72%, rgba(255, 190, 40, 0.10), transparent 50%),
        radial-gradient(ellipse 30% 28% at 28% 70%, rgba(40, 180, 255, 0.10), transparent 50%);
      filter: blur(28px);
    }
    #brand {
      position: absolute; top: 28px; left: 32px; z-index: 4;
      display: flex; flex-direction: column; gap: 6px;
    }
    #brand .markrow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    #brand .short {
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.22em; color: #ff2d92;
    }
    #brand .mark {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff2d92; box-shadow: 0 0 12px #ff2d92;
    }
    #brand h1 {
      margin: 0; font-family: Orbitron, sans-serif; font-weight: 800;
      font-size: 28px; letter-spacing: 0.18em; color: #ff2d92;
      text-shadow: 0 0 18px rgba(255, 45, 146, 0.9), 0 0 40px rgba(255, 45, 146, 0.45);
    }
    #brand .sub {
      font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.22em; color: rgba(255,255,255,0.55);
      text-transform: uppercase;
    }
    #hint {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      z-index: 4; font-family: "IBM Plex Mono", monospace; font-size: 10px;
      letter-spacing: 0.28em; color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }
    #pills {
      position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
      z-index: 4; display: flex; gap: 10px;
    }
    .status {
      font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
      padding: 6px 12px; border-radius: 999px;
    }
    .status.amber { background: #ffc43d; color: #1a1200; box-shadow: 0 0 16px rgba(255,196,61,0.55); }
    .status.pink { background: #ff2d92; color: #fff; box-shadow: 0 0 16px rgba(255,45,146,0.55); }
    #side {
      position: absolute; top: 0; right: 0; width: min(380px, 42vw); height: 100%;
      z-index: 5;
      background: rgba(6, 4, 10, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-left: 1px solid rgba(255, 45, 146, 0.55);
      box-shadow: -20px 0 60px rgba(255, 20, 120, 0.12);
      padding: 22px 22px 40px;
      overflow: auto;
      visibility: hidden;
      will-change: transform;
    }
    #side .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #side .crumb {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      color: rgba(255,255,255,0.45); letter-spacing: 0.04em;
    }
    #side h2 {
      margin: 4px 0 4px; font-size: 26px; letter-spacing: 0.08em;
      color: #ff4da6; font-weight: 700; text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255,45,146,0.5);
    }
    #side .meta {
      font-family: "IBM Plex Mono", monospace; font-size: 11px;
      color: rgba(255,255,255,0.4); margin-bottom: 18px;
    }
    .icon-btn {
      background: none; border: 0; color: rgba(255,255,255,0.5);
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    .icon-btn:hover { color: #fff; }
    .files { list-style: none; margin: 0; padding: 0; }
    .files li {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 10px;
      align-items: center; padding: 9px 8px; margin-bottom: 4px;
      border-radius: 8px; cursor: pointer;
      border: 1px solid transparent;
    }
    .files li:hover, .files li.active {
      border-color: rgba(255, 45, 146, 0.55);
      background: rgba(255, 45, 146, 0.08);
      box-shadow: 0 0 18px rgba(255, 45, 146, 0.12);
    }
    .abbr {
      width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center;
      font-family: Orbitron, sans-serif; font-size: 8px; letter-spacing: 0.08em;
      background: linear-gradient(160deg, #ff4da6, #7a2bff);
      box-shadow: 0 0 14px rgba(255, 45, 146, 0.45);
    }
    .fname {
      font-family: "IBM Plex Mono", monospace; font-size: 13px; color: #f5f5f5;
    }
    .sz, .cnt {
      font-family: "IBM Plex Mono", monospace; font-size: 11px; color: rgba(255,255,255,0.35);
    }
    .note {
      display: none; margin-top: 16px; white-space: pre-wrap;
      font-family: "IBM Plex Mono", monospace; font-size: 12px; line-height: 1.5;
      color: rgba(255,255,255,0.72);
    }
    .note.show { display: block; }
    #labels, #glows { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
    .orb {
      position: absolute; left: 0; top: 0; border-radius: 50%;
      filter: blur(22px); pointer-events: none; mix-blend-mode: screen;
      will-change: transform, opacity;
    }
    #flare {
      position: absolute; left: 0; top: 0; width: 320px; height: 320px;
      pointer-events: none; z-index: 2; mix-blend-mode: screen;
      background: radial-gradient(circle, rgba(255,255,255,0.55) 0%, rgba(255,45,146,0.28) 28%, transparent 68%);
      will-change: transform;
      opacity: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      #side { transition: none; }
    }
    #brand, #hint, #pills { will-change: transform, opacity; }
    .pill {
      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #fff; white-space: nowrap; cursor: pointer; pointer-events: auto;
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 4px; padding: 5px 9px;
      position: absolute; left: 0; top: 0;
      will-change: transform, opacity;
      background: rgba(255, 20, 120, 0.92);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 0 16px rgba(255, 20, 120, 0.55);
      font-size: 11px;
    }
    .pill.core {
      background: #fff; color: #ff2d92; font-size: 13px; padding: 7px 12px;
      box-shadow: 0 0 24px rgba(255,255,255,0.85), 0 0 48px rgba(255,45,146,0.8);
    }
    .pill.hub { font-size: 12px; padding: 6px 10px; }
    .pill.ruling {
      background: #ff9f1a; color: #1a0a00;
      box-shadow: 0 0 16px rgba(255,159,26,0.65);
    }
    .pill.metric {
      background: #ffe566; color: #1a1400;
      box-shadow: 0 0 16px rgba(255,229,102,0.55);
    }
    .pill.cyan {
      background: rgba(56, 189, 248, 0.92); color: #001018;
      box-shadow: 0 0 14px rgba(56,189,248,0.5);
    }
    .pill.violet {
      background: rgba(167, 139, 250, 0.95); color: #120024;
    }
    .pill.leaf {
      background: rgba(255, 20, 120, 0.55);
      font-size: 10px; letter-spacing: 0.1em;
    }
    .pill .n {
      font-size: 9px; letter-spacing: 0; opacity: 0.8; font-weight: 600;
    }
    .fold {
      width: 8px; height: 7px; border: 1.5px solid currentColor;
      border-radius: 1px 1px 0 0; display: inline-block; opacity: 0.85;
      position: relative;
    }
    .fold:after {
      content: ""; position: absolute; left: -1.5px; right: 2px; top: -3px;
      height: 2px; border: 1.5px solid currentColor; border-bottom: 0;
      border-radius: 1px 1px 0 0; width: 4px;
    }
  </style>
</head>
<body>
  <div id="nebula"></div>
  <div id="graph"></div>
  <div id="glows"></div>
  <div id="flare"></div>
  <div id="labels"></div>
  <div id="brand">
    <div class="markrow">
      <div class="mark"></div>
      <div class="short">SHORTLIST · 3</div>
    </div>
    <h1>GROWTHOS</h1>
    <div class="sub">Grokbot · Obsidian Vault · Second Brain</div>
  </div>
  <div id="pills">
    <div class="status amber">Costs must not scale</div>
    <div class="status pink">View-sale gap</div>
  </div>
  <div id="hint">DRAG TO ORBIT · SCROLL TO FLY · CLICK A NODE TO OPEN THE FILE</div>
  <aside id="side">
    <div class="top">
      <button class="icon-btn" id="back" type="button">←</button>
      <button class="icon-btn" id="close" type="button">×</button>
    </div>
    <div class="crumb" id="crumb"></div>
    <h2 id="title"></h2>
    <div class="meta" id="meta"></div>
    <ul class="files" id="files"></ul>
    <pre class="note" id="note"></pre>
  </aside>
  <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.7/dist/gsap.min.js"></script>
  <script>
    const DATA = __GROWTH_DATA__;
    const PANELS = DATA.panels;
    const side = document.getElementById("side");
    const filesEl = document.getElementById("files");
    const noteEl = document.getElementById("note");
    const labels = document.getElementById("labels");
    const glows = document.getElementById("glows");
    const flare = document.getElementById("flare");
    const history = [];
    const hasGsap = typeof gsap !== "undefined";
    const reduceMq = window.matchMedia("(prefers-reduced-motion: reduce)");
    function motionOff() { return reduceMq.matches; }

    function openSide() {
      if (hasGsap) gsap.to(side, { xPercent: 0, autoAlpha: 1, duration: motionOff() ? 0 : 0.45, ease: "power3.out", overwrite: true });
      else {
        side.style.transform = "translateX(0)";
        side.style.visibility = "visible";
      }
    }
    function closeSide() {
      if (hasGsap) gsap.to(side, { xPercent: 100, autoAlpha: 1, duration: motionOff() ? 0 : 0.35, ease: "power2.in", overwrite: true });
      else {
        side.style.transform = "translateX(110%)";
        side.style.visibility = "hidden";
      }
    }

    function renderPanel(id) {
      const p = PANELS[id];
      if (!p) return;
      document.getElementById("crumb").textContent = p.crumb;
      document.getElementById("title").textContent = p.title;
      document.getElementById("meta").textContent = p.meta;
      filesEl.innerHTML = "";
      noteEl.classList.remove("show");
      noteEl.textContent = "";
      (p.items || []).forEach((item) => {
        const li = document.createElement("li");
        const abbr = document.createElement("div");
        abbr.className = "abbr";
        abbr.textContent = item.abbr;
        const name = document.createElement("div");
        name.className = "fname";
        name.textContent = item.name;
        const right = document.createElement("div");
        right.className = item.kind === "folder" ? "cnt" : "sz";
        right.textContent = item.right;
        li.append(abbr, name, right);
        li.onclick = () => {
          document.querySelectorAll(".files li").forEach((n) => n.classList.remove("active"));
          li.classList.add("active");
          if (item.open) {
            history.push(id);
            renderPanel(item.open);
          } else if (item.body) {
            noteEl.textContent = item.body;
            noteEl.classList.add("show");
          }
        };
        filesEl.appendChild(li);
      });
      openSide();
    }

    document.getElementById("close").onclick = () => closeSide();
    document.getElementById("back").onclick = () => {
      const prev = history.pop();
      if (prev) renderPanel(prev);
      else closeSide();
    };

    const Graph = ForceGraph3D()(document.getElementById("graph"))
      .graphData({ nodes: DATA.nodes, links: DATA.links })
      .backgroundColor("#000000")
      .showNavInfo(false)
      .linkColor(() => "rgba(255,90,180,0.28)")
      .linkWidth(0.3)
      .linkOpacity(0.4)
      .nodeRelSize(4)
      .nodeVal("val")
      .nodeColor("color")
      .nodeOpacity(0.95)
      .nodeLabel(() => "")
      .onNodeClick((node) => {
        history.length = 0;
        renderPanel(node.panel);
      });

    Graph.d3Force("charge").strength(-110);
    Graph.d3Force("link").distance((l) => l.distance || 52);
    Graph.d3VelocityDecay(0.32);
    Graph.cameraPosition({ x: 40, y: 24, z: 240 });

    function ensureOverlay() {
      if (labels.childElementCount) return;
      Graph.graphData().nodes.forEach((node) => {
        const orb = document.createElement("div");
        orb.className = "orb";
        const size = node.kind === "core" ? 140 : node.kind === "hub" || node.kind === "ruling" ? 78 : 52;
        orb.style.width = size + "px";
        orb.style.height = size + "px";
        orb.style.background = node.color;
        orb.dataset.half = String(size / 2);
        glows.appendChild(orb);
        const el = document.createElement("div");
        el.className = "pill " + node.kind;
        el.innerHTML = node.html;
        el.onclick = (ev) => {
          ev.stopPropagation();
          history.length = 0;
          renderPanel(node.panel);
        };
        labels.appendChild(el);
      });
    }

    function paint() {
      const nodes = Graph.graphData().nodes;
      ensureOverlay();
      let core = null;
      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        if (node.x == null) continue;
        const c = Graph.graph2ScreenCoords(node.x, node.y, node.z);
        const cam = Graph.camera();
        const dx = node.x - cam.position.x;
        const dy = node.y - cam.position.y;
        const dz = node.z - cam.position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const far = Math.max(0, (dist - 150) / 200);
        const glow = glows.children[i];
        const half = Number(glow.dataset.half) || 26;
        glow.style.transform = "translate3d(" + (c.x - half) + "px," + (c.y - half) + "px,0)";
        glow.style.opacity = String(Math.max(0.08, 0.6 - far * 0.5));
        const lab = labels.children[i];
        lab.style.transform = "translate3d(" + c.x + "px," + (c.y - 18) + "px,0) translate(-50%,-100%)";
        lab.style.filter = far > 0.4 ? "blur(" + (far * 3) + "px)" : "none";
        lab.style.opacity = String(Math.max(0, 1 - far * 1.35));
        lab.style.visibility = far > 0.9 ? "hidden" : "visible";
        if (node.kind === "core") core = c;
      }
      if (core) {
        flare.style.transform = "translate3d(" + (core.x - 160) + "px," + (core.y - 160) + "px,0)";
        flare.style.opacity = "1";
      }
    }

    Graph.onEngineTick(paint);
    let angle = 0.35;
    let holding = false;
    let ready = false;
    Graph.onEngineStop(() => { ready = true; paint(); });
    setTimeout(() => { ready = true; }, 1800);
    const orbit = 250;
    if (!motionOff()) {
      setInterval(() => {
        if (holding || !ready) return;
        angle += 0.003;
        Graph.cameraPosition({
          x: orbit * Math.sin(angle),
          z: orbit * Math.cos(angle),
          y: 22,
        });
        paint();
      }, 40);
    }
    window.addEventListener("pointerdown", () => { holding = true; });
    window.addEventListener("pointerup", () => { holding = false; });

    if (hasGsap) {
      gsap.set(side, { xPercent: 100, autoAlpha: 1 });
      if (!motionOff()) {
        gsap.set("#brand", { autoAlpha: 0, y: -14 });
        gsap.set("#hint", { autoAlpha: 0 });
        gsap.set(".status", { autoAlpha: 0 });
        gsap.timeline({ defaults: { ease: "power3.out" } })
          .to("#brand", { autoAlpha: 1, y: 0, duration: 0.7 })
          .to(".status", { autoAlpha: 1, duration: 0.35, stagger: 0.08 }, "-=0.35")
          .to("#hint", { autoAlpha: 1, duration: 0.45 }, "-=0.2");
      }
    } else {
      side.style.transform = "translateX(110%)";
    }

    window.GROWTHOS = { open: (id) => renderPanel(id), data: DATA };
  </script>
</body>
</html>
